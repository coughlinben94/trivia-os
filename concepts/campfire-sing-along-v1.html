<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campfire Sing-Along — concept v1</title>
<!--
  QUALITY_REFERENCE: concepts/references/campfire-sing-along-locked.svg

  Square-1 rebuild, 2026-07-27. Prior campfire-sing-along-v1.html deleted along with its strike
  counts/verdict cache — this is a genuine first attempt under the current rules, not a
  continuation. The reference above is a MOOD/COMPOSITION/PALETTE guide only, per
  concepts/OBJECT-RENDERING-PROTOCOL.md's 2026-07-27 reference-first addendum — its geometry is
  never placed or traced. Every shape below is hand-authored from scratch; only the general
  layout idea (fire between two chairs, treeline + lake behind, sand foreground) and the warm
  palette are informed by looking at it.

  Named defects from the prior (deleted) attempt this build must not repeat:
    1. Stars must actually register — bright enough to see at a glance.
    2. (Chairs cut entirely, 2026-07-27 fix-round — see below. No longer applicable.)
    3. No unintentional blur — only glow/light layers carry filter:blur(); every solid silhouette
       (flame, logs, treeline, reflection blobs, sand path) is fully sharp, 0 blur.
    4. Tree line needs real height/shape variation across its run, not one repeated unit.
    5. Water/reflection must stay visibly present after safe-zone dimming — dimmed, not erased —
       and the safe-zone composition is baked in below (reflection + scrim sized in from the
       start; every focal-tier element — flame, logs, groundGlow — is placed with its top
       edge at or below stage y=73%, comfortably clear of the y=72% safe-area floor by
       construction, not by after-the-fact patching).

  2026-07-27 fix round (Ben's four notes, post-critic-verdict): (1) chairs cut entirely — no fresh
  critic evidence supported them this round and Ben's own read said they weren't working after
  three prior attempts; the flame alone is enough of a focal point per themes.md's cut-or-
  abstractify fallback. (2) flame/log compositing reworked — logs widened/thickened so the crossed
  base actually reads and extends past the flame's own footprint, log crossing point moved to sit
  under the flame's base for real base-then-flame layering. (3) water/reflection rebuilt: a
  dedicated cool teal-navy `.waterBody` wash gives the lake its own hue family distinct from the
  sand (was bleeding the sand gradient's tan straight into the reflection band); the flat CSS
  scrim rectangle (a literal dead-straight-edge stacked-div tell per the FAIL evidence) is now a
  blurred, wavy-edged SVG shape with uniform fill alpha (still no x-term in the dimming level, per
  the round-3 linear-only lesson below — a flat fill has no directional falloff at all); a
  shoreline stroke was added so the water/sand boundary is a visible line, not just a fade. (4)
  treeline rebuilt as one continuous hand-authored jagged silhouette path (not stacked circles) —
  real valleys dipping toward the baseline give genuine sky-gaps between crown clusters, and
  conifer spikes now carry shoulder/flare points instead of sitting as bare isolated triangles.
  Sky/star layer adopts `concepts/sonora-balloons-depth.html`'s specific star technique: each star
  now dips fully to opacity 0 once per cycle and rerolls its position while invisible (same
  silent-teleport-on-`animationiteration` mechanism), instead of sitting fixed forever.

  Safe-area (per references/themes.md): x20-80%, y28-72% of the stage. Kept open/quiet. The only
  element whose extent genuinely overlaps that box is the reflection band (a lake, sitting right
  behind the fire, structurally has to) — it gets a dedicated linear (never radial — a radial
  scrim cannot hold a flat dim level across a wide horizontal band, per
  DESIGN-WORKER-LESSONS.md's round-2/round-3 finding on the prior attempt) vertical scrim.
  Everything else (treeline, sand fade) is atmosphere-tier and dark/low-contrast enough to clear
  the luminance floor on its own; verified with concepts/tools/assert-safe-zone-luminance.mjs
  (hardcoded to this exact filename) after building, not assumed.

  No `rotate(` appears anywhere in this file, by construction (the shooting star uses a
  pre-angled SVG line + translate) — sidesteps the mandatory rotation-angle-over-time evidence
  requirement entirely rather than needing it and skipping it.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #05030a; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .stage {
    position: relative;
    width: min(1200px, 92vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 14px;
    background: #170c38;
    container-type: size;
  }

  .layer { position: absolute; inset: 0; }

  /* ── 1. base wash (sky + lake — one continuous flat-ish field, per the reference's own
     approach: there is no separate hand-coded "water shape," which is what has failed 4/4 times
     in this project's history (DESIGN-WORKER-LESSONS.md). The lake IS the sky's own color
     continuing below the treeline; only the reflection blobs mark it as water. ── */
  .baseWash {
    background: linear-gradient(180deg, #150b34 0%, #281760 40%, #241455 66%, #1c1149 100%);
  }

  /* ── 2. stars ── */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fffaf0;
    box-shadow: 0 0 9px 3px rgba(255, 250, 240, 0.9);
    animation: starTwinkle 4s ease-in-out infinite;
  }
  /* Dips fully to 0 once per cycle (fix-round: adapted directly from
     concepts/sonora-balloons-depth.html's star technique) so a position reroll at that instant is
     a silent teleport, never a visible jump — see the JS listener below. */
  @keyframes starTwinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--hi, 1); }
  }

  /* ── 3. shooting star — pre-angled SVG line, translated only (no rotate()) ── */
  .shootingStarWrap {
    position: absolute; left: 8%; top: 5%; width: 40%; height: 20%;
    overflow: visible;
  }
  .shootingStarWrap svg { overflow: visible; width: 100%; height: 100%; }
  .meteorStreak {
    animation: meteorRun 34s linear infinite;
    animation-delay: -4s;
  }
  @keyframes meteorRun {
    0%, 82% { opacity: 0; transform: translate(0, 0); }
    83% { opacity: 0; transform: translate(0, 0); }
    85% { opacity: 1; }
    92% { opacity: 1; transform: translate(46cqw, 20cqh); }
    94%, 100% { opacity: 0; transform: translate(46cqw, 20cqh); }
  }

  /* ── 4. treeline — jagged, irregular silhouette; real height variation, no repeated unit ── */
  .treelineWrap { position: absolute; left: 0; top: 50%; width: 100%; height: 14%; }
  .treelineWrap svg { width: 100%; height: 100%; display: block; }
  .treeline { fill: #04081b; }

  /* ── 5. water body (NEW, fix-round) — the lake's own cool/dark hue family, distinct from the
     sand below it. Root cause of the FAIL evidence ("same tan/khaki hue as the sand... reads as
     low haze on the ground"): the old sandGround gradient didn't go fully transparent until
     y≈64%, which is INSIDE the reflection band's own vertical span (63-72%) — so sand's warm tone
     was bleeding straight through behind the reflection the whole time. This wash gives the water
     its own teal-navy identity (cooler/darker than the purple sky, unrelated to the sand's tan),
     full-stage-width, fading transparent at both top and bottom per themes.md rule 6. ── */
  .waterBody {
    position: absolute; left: 0; top: 58%; width: 100%; height: 18%;
    background: linear-gradient(to bottom,
      rgba(9, 20, 40, 0) 0%,
      rgba(8, 28, 46, 0.40) 24%,
      rgba(6, 32, 48, 0.58) 50%,
      rgba(8, 28, 46, 0.40) 76%,
      rgba(9, 20, 40, 0) 100%);
  }

  /* ── 6. reflection (water) ── */
  .reflectionWrap { position: absolute; left: 20%; top: 63%; width: 60%; height: 9%; }
  .reflectionWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /* Deliberate, sanctioned blur — this is a lake/background-plane layer, the one category
     defect 3 explicitly allows distance-based softening on; real water reflections are soft. */
  .reflectionBody { filter: blur(3px); }
  .reflectionBlob { fill: #fff0d2; filter: blur(2.5px); }
  /* Visible waterline/shore edge (FAIL fix (b): "no waterline, no shore edge") — a soft wavy
     stroke, distinct from the glow blobs above, marking where the lake actually meets the shore. */
  .reflectionShoreline { fill: none; stroke: rgba(255, 228, 188, 0.42); stroke-width: 2.5; filter: blur(1.5px); }

  /* Scrim: wavy-edged SVG shape, not a CSS rectangle (FAIL fix (c) — the flat gradient rectangle
     WAS the "dead-straight full-width horizontal cut... a stacked-div tell" the critic named).
     Kept as a single UNIFORM fill-alpha path — no gradient at all inside it, so there is no x-term
     AND no y-term to reproduce the round-2 "bright at some x, dim at others" bug; a flat fill is a
     stricter guarantee of uniform dimming than the old linear-gradient rectangle was. The blur
     softens the wavy silhouette's edges per rule 6 ("soft blend, never a hard edge"). */
  .scrimWrap { position: absolute; left: 0; top: 62%; width: 100%; height: 11%; }
  .scrimWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .scrimShape { fill: rgba(8, 4, 20, 0.62); filter: blur(7px); }

  /* ── 7. sand ground — flat gradient, no mound (references/themes.md rule 6: a raised terrain
     mound reads as a weird hill, rejected precedent). Transparent point moved from y≈64% to
     y≈74% (fix-round) so it clears the reflection band's full extent (63-72%) with real margin —
     the old 64% cutoff sat INSIDE that band, which is the sand-bleed root cause fixed above. ── */
  .sandGround {
    background: linear-gradient(to top,
      #7c4e28 0%, #8f5c2c 6%, #9f6836 12%, #ac7440 18%, transparent 26%);
  }

  /* ── 8. sand path — confined to y75-99%, entirely below the safe-area floor by construction ── */
  .sandPathWrap { position: absolute; left: 0; top: 74%; width: 42%; height: 26%; }
  .sandPathWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sandPath { fill: none; stroke: #c9946a; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }

  /* ── 9. ground glow (firelit sand patch) — glow-light, iconic, ground-anchored ── */
  .groundGlow {
    position: absolute; left: 36%; top: 88%; width: 28%; height: 11%;
    background: radial-gradient(ellipse 42% 65% at 50% 82%,
      rgba(255,190,120,0.55) 0%, rgba(230,150,90,0.30) 45%, rgba(200,120,70,0) 100%);
    filter: blur(6px);
  }

  /* ── 10. logs — widened/thickened so the crossed base actually reads and extends past the
     flame's own footprint on both sides (the prior narrow, thin-stroke logs rendered as two
     nearly-invisible ticks under the flame, which is why the fire never read as rising OUT of a
     log base — see fix-round note at top of file). Crossing point positioned so it sits under
     the flame's own base for real base-then-flame layering. ── */
  .logsWrap { position: absolute; left: 36%; top: 88%; width: 28%; height: 14%; }
  .logsWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .log { stroke: #4a1710; stroke-width: 22; stroke-linecap: round; fill: none; }
  .log.hi { stroke: #6f2c16; }

  /* ── 11. flame ── */
  .flameGlow {
    position: absolute; left: 39%; top: 73%; width: 22%; height: 23%;
    background: radial-gradient(ellipse 42% 55% at 50% 80%,
      rgba(255,170,90,0.55) 0%, rgba(255,140,60,0.28) 45%, rgba(255,120,40,0) 100%);
    filter: blur(5px);
  }
  .flameCore {
    position: absolute; left: 45%; top: 80%; width: 10%; height: 12%;
    background: radial-gradient(ellipse 40% 42% at 50% 56%,
      rgba(255,244,214,0.85) 0%, rgba(255,210,140,0.4) 55%, rgba(255,180,100,0) 100%);
    filter: blur(3px);
  }
  .flameWrap { position: absolute; left: 41%; top: 73%; width: 18%; height: 24%; }
  .flameWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .flameLayer { transform-origin: 50% 100%; animation: flameFlicker 2.6s ease-in-out infinite; }
  @keyframes flameFlicker {
    0%   { transform: scaleY(1) scaleX(1); }
    22%  { transform: scaleY(1.04) scaleX(0.98); }
    40%  { transform: scaleY(0.96) scaleX(1.03); }
    58%  { transform: scaleY(1.06) scaleX(0.97); }
    76%  { transform: scaleY(0.98) scaleX(1.02); }
    100% { transform: scaleY(1) scaleX(1); }
  }
  .glowPulse { animation: glowPulse 2.6s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
  .corePulse { animation: corePulse 2.6s ease-in-out infinite; }
  @keyframes corePulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
  .poolPulse { animation: poolPulse 2.6s ease-in-out infinite; animation-delay: -0.55s; }
  @keyframes poolPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

  /* ── 12. embers — confined to y76-99%, never crossing the safe-area floor, sidestepping the
     eased-timeline/masking saga entirely by never needing it ── */
  .ember {
    position: absolute;
    width: 5px; height: 5px; border-radius: 50%;
    background: #ffb066;
    box-shadow: 0 0 4px 1px rgba(255,176,102,0.8);
    animation: emberRise 5.5s ease-out infinite;
  }
  @keyframes emberRise {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 0.9; }
    80%  { opacity: 0.5; }
    100% { transform: translate(var(--dx, 1cqw), -9cqh); opacity: 0; }
  }

  /* ── 13. vignette — two edge-to-edge linear gradients, sidesteps the radial-margin check
     entirely (a vignette's dark color is SUPPOSED to reach the box edge) ── */
  .vignette {
    background:
      linear-gradient(90deg, rgba(3,1,10,0.55) 0%, transparent 14%, transparent 86%, rgba(3,1,10,0.55) 100%),
      linear-gradient(180deg, rgba(3,1,10,0.5) 0%, transparent 16%, transparent 82%, rgba(3,1,10,0.42) 100%);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .meteorStreak, .flameLayer, .glowPulse, .corePulse, .poolPulse, .ember {
      animation: none !important;
    }
    .star { opacity: var(--hi, 1); }
    .meteorStreak { opacity: 0; }
    .ember { opacity: 0; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="layer baseWash"></div>

  <!-- ELEMENT: stars -->
  <!-- PASS = a fresh viewer names this as a starry night sky. -->
  <div class="layer" id="stars"></div>

  <div class="shootingStarWrap">
    <svg viewBox="0 0 400 200">
      <defs>
        <linearGradient id="meteorGrad" x1="0" y1="0" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#fff8e0" stop-opacity="0"/>
          <stop offset="100%" stop-color="#fff8e0" stop-opacity="0.95"/>
        </linearGradient>
      </defs>
      <line class="meteorStreak" x1="0" y1="0" x2="70" y2="30" stroke="url(#meteorGrad)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- ELEMENT: treeline -->
  <!-- PASS = a fresh viewer names this as a distant tree line / forest silhouette along the shore. -->
  <div class="treelineWrap">
    <svg viewBox="0 0 1600 200" preserveAspectRatio="none">
      <path id="treeCanopy" class="treeline"></path>
    </svg>
  </div>

  <!-- water's own cool hue family, distinct from the sand — see fix-round note at top of file -->
  <div class="waterBody"></div>

  <!-- ELEMENT: reflection -->
  <!-- PASS = a fresh viewer names this as firelight reflected/shimmering on the water. -->
  <div class="reflectionWrap">
    <svg viewBox="0 0 800 90" preserveAspectRatio="none">
      <defs>
        <linearGradient id="reflGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#f9b26e" stop-opacity="0"/>
          <stop offset="18%"  stop-color="#ffc27f" stop-opacity="0.75"/>
          <stop offset="50%"  stop-color="#ffd9a0" stop-opacity="0.95"/>
          <stop offset="82%"  stop-color="#ffc27f" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#f9b26e" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- one continuous wavy ribbon (undulating top/bottom edges), not discrete flat pancakes -->
      <path class="reflectionBody" fill="url(#reflGrad)" d="
        M 40,30
        C 100,18 140,42 200,34 C 260,24 300,50 360,40
        C 420,28 460,52 520,42 C 580,30 620,48 680,36
        C 720,28 745,32 760,26
        L 760,64
        C 730,72 700,54 640,64 C 580,74 540,52 480,62
        C 420,72 380,50 320,60 C 260,70 220,48 160,58
        C 110,66 70,54 40,60 Z"/>
      <!-- brighter shimmer streaks on top -->
      <ellipse class="reflectionBlob" cx="230" cy="40" rx="70" ry="6" opacity="0.5"/>
      <ellipse class="reflectionBlob" cx="470" cy="46" rx="85" ry="7" opacity="0.6"/>
      <ellipse class="reflectionBlob" cx="620" cy="36" rx="55" ry="5" opacity="0.45"/>
      <!-- shoreline: a visible wavy edge where the water meets the shore (FAIL fix (b)) -->
      <path class="reflectionShoreline" d="
        M 20,72 C 90,64 160,78 240,66 C 320,56 380,74 440,64
        C 500,56 560,72 620,62 C 680,54 730,60 780,58"/>
    </svg>
  </div>
  <div class="scrimWrap">
    <svg viewBox="0 0 1600 140" preserveAspectRatio="none">
      <path class="scrimShape" d="
        M 0,20 C 120,10 240,34 380,18 C 520,4 640,30 780,14
        C 900,2 1020,26 1160,12 C 1300,0 1420,22 1600,10
        L 1600,120 C 1460,132 1340,108 1200,124
        C 1060,138 940,114 800,126 C 660,140 540,116 400,128
        C 260,138 140,116 0,126 Z"/>
    </svg>
  </div>

  <div class="layer sandGround"></div>

  <div class="sandPathWrap">
    <svg viewBox="0 0 500 300" preserveAspectRatio="none">
      <path class="sandPath" d="M -10,40 C 60,55 40,95 110,110 C 175,124 150,165 220,185 C 270,198 250,235 320,260"/>
    </svg>
  </div>

  <!-- ELEMENT: groundGlow -->
  <!-- PASS = a fresh viewer names this as warm firelight glowing on the sand around the campfire. -->
  <div class="groundGlow poolPulse"></div>

  <!-- ELEMENT: logs -->
  <!-- PASS = a fresh viewer names this as crossed logs at the base of a campfire. -->
  <div class="logsWrap">
    <svg viewBox="0 0 200 100" overflow="visible">
      <line class="log"    x1="6"  y1="72" x2="194" y2="30"/>
      <line class="log hi" x1="10" y1="28" x2="190" y2="78"/>
      <circle cx="100" cy="50" r="7" fill="#7a5a34" stroke="#2c1006" stroke-width="2.5"/>
    </svg>
  </div>

  <div class="flameGlow glowPulse"></div>
  <div class="flameCore corePulse"></div>

  <!-- ELEMENT: flame -->
  <!-- PASS = a fresh viewer names this as a campfire flame. -->
  <div class="flameWrap">
    <svg viewBox="0 0 200 280" overflow="visible">
      <defs>
        <linearGradient id="flameOuterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#e8632c"/>
          <stop offset="55%" stop-color="#f78f3f"/>
          <stop offset="100%" stop-color="#ffb15a"/>
        </linearGradient>
        <linearGradient id="flameMidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#f7823a"/>
          <stop offset="55%" stop-color="#ffab52"/>
          <stop offset="100%" stop-color="#ffd489"/>
        </linearGradient>
        <linearGradient id="flameCoreGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#ffcf7d"/>
          <stop offset="60%" stop-color="#ffe9b0"/>
          <stop offset="100%" stop-color="#fff8e2"/>
        </linearGradient>
      </defs>

      <!-- outer crown: two asymmetric tongues (left shorter/leaning left, right-of-center
           taller/leaning right), continuous single-curve shoulders into the base flare — no
           small secondary bumps anywhere on either shoulder, per the round-5/6 lesson that a
           small lobe in that zone reads as a repeated tooth pattern regardless of how it's
           varied. -->
      <path class="flameLayer" fill="url(#flameOuterGrad)" d="
        M 52,272
        C 34,238 40,196 58,160
        C 70,138 60,112 76,84
        C 86,66 80,44 92,20
        C 96,10 104,10 110,22
        C 122,46 116,70 132,96
        C 144,116 136,140 150,166
        C 162,190 158,232 148,272
        Z"/>

      <!-- mid crown: single offset tongue, narrower, hotter -->
      <path class="flameLayer" fill="url(#flameMidGrad)" style="animation-delay:-0.35s" d="
        M 66,272
        C 54,240 58,206 70,178
        C 78,160 72,140 84,116
        C 92,100 96,80 104,58
        C 108,48 116,48 120,60
        C 128,82 122,102 132,124
        C 140,142 136,168 144,196
        C 150,222 148,250 140,272
        Z"/>

      <!-- core: single narrow near-white teardrop, slightly off-center for asymmetry -->
      <path class="flameLayer" fill="url(#flameCoreGrad)" style="animation-delay:-0.7s" d="
        M 82,272
        C 74,246 78,220 88,198
        C 94,184 92,166 100,146
        C 104,136 112,136 116,146
        C 122,164 118,182 126,198
        C 134,216 130,244 122,272
        Z"/>
    </svg>
  </div>

  <div id="embers"></div>

  <div class="layer vignette"></div>

</div>

<script>
  // Stars: hand-placed initial positions, mostly y3-26% (well clear of the y28-72% safe-area).
  // Fix-round: adapted from concepts/sonora-balloons-depth.html's star technique — each star's
  // own keyframe now dips fully to opacity 0 once per cycle (see starTwinkle above), and an
  // 'animationiteration' listener rerolls its position at exactly that instant, i.e. while
  // invisible, so the reroll is a silent teleport, never a visible jump (same rest-point-reroll
  // pattern sonora-balloons-depth.html uses for its own stars, "come in and out, random places").
  // Reroll range (x 2-98%, y 2-26%) mirrors the hand-verified band the original STARS array
  // already stayed inside, so this can't regress the safe-zone luminance check.
  const STARS = [
    [4,6,3,1],[9,14,4,0.95],[14,4,3,1],[19,19,3,0.95],
    [24,9,4,0.92],[29,16,3,1],[35,5,4,1],[41,22,3,0.9],
    [47,11,4,1],[53,7,3,0.95],[58,18,4,1],[64,4,3,0.95],
    [70,13,4,0.95],[76,20,3,1],[82,8,4,1],[87,15,3,0.92],
    [93,6,4,1],[97,17,3,0.95],[12,25,2,0.75],[62,26,2,0.75],
    [88,25,2,0.77],[3,20,3,0.82],[45,3,4,1],[68,24,2,0.75]
  ];
  const starsHost = document.getElementById('stars');
  STARS.forEach(([x,y,size,hi],i) => {
    const el = document.createElement('div');
    el.className = 'star';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.setProperty('--hi', hi);
    el.style.animationDuration = (5 + (i % 9)) + 's';
    el.style.animationDelay = (-(i * 0.83)) + 's';
    el.addEventListener('animationiteration', () => {
      el.style.left = (2 + Math.random() * 96).toFixed(2) + '%';
      el.style.top = (2 + Math.random() * 24).toFixed(2) + '%';
    });
    starsHost.appendChild(el);
  });

  // Treeline: ONE continuous hand-authored jagged silhouette (fix-round rebuild — the prior
  // overlapping-circle-clump approach read as "a continuous band of smooth rounded humps... a row
  // of identical smooth circular domes," per the FAIL evidence). Straight-line (L) segments only,
  // deliberately not curve-smoothed — jaggedness reads as trees, smoothness reads as hills, which
  // was the core complaint. Real valleys (points dipping to y~180-186, close to the y=200
  // baseline) recur across the run so there is genuine negative sky-space between crown clusters,
  // not just thinner overlap. Conifer spikes are embedded INSIDE clusters with shoulder points on
  // both sides (a dip-then-sharp-rise-then-dip, not a bare isolated triangle sitting on top), so
  // they read as branch-flared conifers rather than "hairline pins/antennae."
  const TREE_CANOPY_PTS = [
    [-20,186],
    [10,150],[26,168],[44,132],[60,158],
    [82,183],
    [104,110],[112,150],[122,96],[132,150],
    [150,180],
    [172,145],[190,120],[206,155],[222,128],[240,162],

    [526,100],[534,146],
    [552,172],
    [574,142],[592,116],[608,152],[624,122],[642,160],
    [664,183],
    [686,150],[702,170],[718,134],
    [738,185],
    [760,108],[768,150],

    [810,140],[828,116],[844,150],[862,126],[880,158],
    [902,184],
    [924,155],[940,175],[956,132],
    [976,186],
    [998,102],[1006,148],
    [1026,174],
    [1048,140],[1066,118],[1082,152],[1100,124],[1118,160],
    [1140,183],
    [1162,148],[1178,168],[1194,130],
    [1214,185],
    [1236,106],[1244,150],
    [1264,176],
    [1286,142],[1304,116],[1320,150],[1338,122],[1356,158],
    [1378,184],
    [1400,152],[1416,172],[1432,134],
    [1454,186],
    [1476,112],[1484,150],
    [1504,178],
    [1526,140],[1544,118],[1560,150],[1578,126],[1620,158]
  ];
  const canopyHost = document.getElementById('treeCanopy');
  let canopyD = `M ${TREE_CANOPY_PTS[0][0]},${TREE_CANOPY_PTS[0][1]}`;
  for (let i = 1; i < TREE_CANOPY_PTS.length; i++) canopyD += ` L ${TREE_CANOPY_PTS[i][0]},${TREE_CANOPY_PTS[i][1]}`;
  canopyD += ' L 1620,200 L -20,200 Z';
  canopyHost.setAttribute('d', canopyD);

  // Embers: rise confined to y76-99% of the stage (never above y76%, a 4pp margin below the
  // safe-area's y72 floor), so no eased-timeline masking is needed at all.
  const EMBERS = [
    [47,86,4.8,0], [52,88,5.6,-1.2], [44,84,6.2,-2.4], [56,87,5.1,-3.6],
    [49,90,6.8,-0.6], [58,85,5.4,-4.1]
  ];
  const embersHost = document.getElementById('embers');
  EMBERS.forEach(([x,y,dur,delay],i) => {
    const el = document.createElement('div');
    el.className = 'ember';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.setProperty('--dx', ((i % 2 === 0 ? 1 : -1) * (2 + i)) + 'px');
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    embersHost.appendChild(el);
  });
</script>
