<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campfire Sing-Along — concept v1</title>
<!--
  QUALITY_REFERENCE: concepts/references/campfire-sing-along-locked.svg

  Square-1 rebuild, 2026-07-27. Prior campfire-sing-along-v1.html deleted along with its strike
  counts/verdict cache — this is a genuine first attempt under the current rules, not a
  continuation. The reference above is a MOOD/COMPOSITION/PALETTE guide only, per
  concepts/OBJECT-RENDERING-PROTOCOL.md's 2026-07-27 reference-first addendum — its geometry is
  never placed or traced. Every shape below is hand-authored from scratch; only the general
  layout idea (fire between two chairs, treeline + lake behind, sand foreground) and the warm
  palette are informed by looking at it.

  Named defects from the prior (deleted) attempt this build must not repeat:
    1. Stars must actually register — bright enough to see at a glance.
    2. Chairs need real presence, not a thin flat silhouette.
    3. No unintentional blur — only glow/light layers carry filter:blur(); every solid silhouette
       (flame, logs, chairs, treeline, reflection blobs, sand path) is fully sharp, 0 blur.
    4. Tree line needs real height/shape variation across its run, not one repeated unit.
    5. Water/reflection must stay visibly present after safe-zone dimming — dimmed, not erased —
       and the safe-zone composition is baked in below (reflection + scrim sized in from the
       start; every focal-tier element — flame, chairs, logs, groundGlow — is placed with its top
       edge at or below stage y=73%, comfortably clear of the y=72% safe-area floor by
       construction, not by after-the-fact patching).

  Safe-area (per references/themes.md): x20-80%, y28-72% of the stage. Kept open/quiet. The only
  element whose extent genuinely overlaps that box is the reflection band (a lake, sitting right
  behind the fire, structurally has to) — it gets a dedicated linear (never radial — a radial
  scrim cannot hold a flat dim level across a wide horizontal band, per
  DESIGN-WORKER-LESSONS.md's round-2/round-3 finding on the prior attempt) vertical scrim.
  Everything else (treeline, sand fade) is atmosphere-tier and dark/low-contrast enough to clear
  the luminance floor on its own; verified with concepts/tools/assert-safe-zone-luminance.mjs
  (hardcoded to this exact filename) after building, not assumed.

  No `rotate(` appears anywhere in this file, by construction (mirrored chair uses scaleX, the
  shooting star uses a pre-angled SVG line + translate) — sidesteps the mandatory
  rotation-angle-over-time evidence requirement entirely rather than needing it and skipping it.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #05030a; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .stage {
    position: relative;
    width: min(1200px, 92vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 14px;
    background: #170c38;
    container-type: size;
  }

  .layer { position: absolute; inset: 0; }

  /* ── 1. base wash (sky + lake — one continuous flat-ish field, per the reference's own
     approach: there is no separate hand-coded "water shape," which is what has failed 4/4 times
     in this project's history (DESIGN-WORKER-LESSONS.md). The lake IS the sky's own color
     continuing below the treeline; only the reflection blobs mark it as water. ── */
  .baseWash {
    background: linear-gradient(180deg, #150b34 0%, #281760 40%, #241455 66%, #1c1149 100%);
  }

  /* ── 2. stars ── */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fffaf0;
    box-shadow: 0 0 9px 3px rgba(255, 250, 240, 0.9);
    animation: starTwinkle 4s ease-in-out infinite;
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: var(--lo, 0.55); }
    50% { opacity: var(--hi, 1); }
  }

  /* ── 3. shooting star — pre-angled SVG line, translated only (no rotate()) ── */
  .shootingStarWrap {
    position: absolute; left: 8%; top: 5%; width: 40%; height: 20%;
    overflow: visible;
  }
  .shootingStarWrap svg { overflow: visible; width: 100%; height: 100%; }
  .meteorStreak {
    animation: meteorRun 34s linear infinite;
    animation-delay: -4s;
  }
  @keyframes meteorRun {
    0%, 82% { opacity: 0; transform: translate(0, 0); }
    83% { opacity: 0; transform: translate(0, 0); }
    85% { opacity: 1; }
    92% { opacity: 1; transform: translate(46cqw, 20cqh); }
    94%, 100% { opacity: 0; transform: translate(46cqw, 20cqh); }
  }

  /* ── 4. treeline — jagged, irregular silhouette; real height variation, no repeated unit ── */
  .treelineWrap { position: absolute; left: 0; top: 50%; width: 100%; height: 14%; }
  .treelineWrap svg { width: 100%; height: 100%; display: block; }
  .treeline { fill: #04081b; }

  /* ── 5. reflection (water) ── */
  .reflectionWrap { position: absolute; left: 20%; top: 63%; width: 60%; height: 9%; }
  .reflectionWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /* Deliberate, sanctioned blur — this is a lake/background-plane layer, the one category
     defect 3 explicitly allows distance-based softening on; real water reflections are soft. */
  .reflectionBody { filter: blur(3px); }
  .reflectionBlob { fill: #fff0d2; filter: blur(2.5px); }

  /* Linear-only scrim (never radial — see header note). Uniform across the whole width of its
     own box, so it cannot reproduce the round-2 "bright at some x, dim at others" bug by
     construction — there is no x-term in a `to bottom` gradient. */
  .reflectionScrim {
    /* Full stage width, not just the reflection's own x-span: a narrower box's left/right edges
       cut across plain lake with nothing to hide the seam, which rendered as a visible hard
       rectangle outline on the first pass. Full-width edges land at the stage's own frame
       boundary instead, per references/themes.md rule 6's "fade only at the transitions that
       are actually visible" pattern — only top/bottom need to fade, and they still do. */
    position: absolute; left: 0; top: 62%; width: 100%; height: 11%;
    background: linear-gradient(to bottom,
      rgba(8,4,20,0) 0%,
      rgba(8,4,20,0.72) 28%,
      rgba(8,4,20,0.72) 72%,
      rgba(8,4,20,0) 100%);
  }

  /* ── 6. sand ground — flat gradient, no mound (references/themes.md rule 6: a raised terrain
     mound reads as a weird hill, rejected precedent). Fully transparent by stage y≈64%, well
     clear of the safe-area floor at y72%. ── */
  .sandGround {
    background: linear-gradient(to top,
      #7c4e28 0%, #96622f 8%, #a5713f 15%, #c08a54 22%, transparent 36%);
  }

  /* ── 7. sand path — confined to y75-99%, entirely below the safe-area floor by construction ── */
  .sandPathWrap { position: absolute; left: 0; top: 74%; width: 42%; height: 26%; }
  .sandPathWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sandPath { fill: none; stroke: #c9946a; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }

  /* ── 8. ground glow (firelit sand patch) — glow-light, iconic, ground-anchored ── */
  .groundGlow {
    position: absolute; left: 36%; top: 88%; width: 28%; height: 11%;
    background: radial-gradient(ellipse 42% 65% at 50% 82%,
      rgba(255,190,120,0.55) 0%, rgba(230,150,90,0.30) 45%, rgba(200,120,70,0) 100%);
    filter: blur(6px);
  }

  /* ── 9. logs ── */
  .logsWrap { position: absolute; left: 44%; top: 88%; width: 12%; height: 9%; }
  .logsWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .log { stroke: #4a1710; stroke-width: 15; stroke-linecap: round; fill: none; }
  .log.hi { stroke: #6b2814; }

  /* ── 10. flame ── */
  .flameGlow {
    position: absolute; left: 39%; top: 73%; width: 22%; height: 23%;
    background: radial-gradient(ellipse 42% 55% at 50% 80%,
      rgba(255,170,90,0.55) 0%, rgba(255,140,60,0.28) 45%, rgba(255,120,40,0) 100%);
    filter: blur(5px);
  }
  .flameCore {
    position: absolute; left: 45%; top: 80%; width: 10%; height: 12%;
    background: radial-gradient(ellipse 40% 42% at 50% 56%,
      rgba(255,244,214,0.85) 0%, rgba(255,210,140,0.4) 55%, rgba(255,180,100,0) 100%);
    filter: blur(3px);
  }
  .flameWrap { position: absolute; left: 41%; top: 73%; width: 18%; height: 24%; }
  .flameWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .flameLayer { transform-origin: 50% 100%; animation: flameFlicker 2.6s ease-in-out infinite; }
  @keyframes flameFlicker {
    0%   { transform: scaleY(1) scaleX(1); }
    22%  { transform: scaleY(1.04) scaleX(0.98); }
    40%  { transform: scaleY(0.96) scaleX(1.03); }
    58%  { transform: scaleY(1.06) scaleX(0.97); }
    76%  { transform: scaleY(0.98) scaleX(1.02); }
    100% { transform: scaleY(1) scaleX(1); }
  }
  .glowPulse { animation: glowPulse 2.6s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
  .corePulse { animation: corePulse 2.6s ease-in-out infinite; }
  @keyframes corePulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
  .poolPulse { animation: poolPulse 2.6s ease-in-out infinite; animation-delay: -0.55s; }
  @keyframes poolPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

  /* ── 11. embers — confined to y76-99%, never crossing the safe-area floor, sidestepping the
     eased-timeline/masking saga entirely by never needing it ── */
  .ember {
    position: absolute;
    width: 5px; height: 5px; border-radius: 50%;
    background: #ffb066;
    box-shadow: 0 0 4px 1px rgba(255,176,102,0.8);
    animation: emberRise 5.5s ease-out infinite;
  }
  @keyframes emberRise {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: 0.9; }
    80%  { opacity: 0.5; }
    100% { transform: translate(var(--dx, 1cqw), -9cqh); opacity: 0; }
  }

  /* ── 12. chairs ── */
  .chairWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chairLeft { position: absolute; left: 21%; top: 74%; width: 18%; height: 24%; }
  .chairRight { position: absolute; left: 61%; top: 75%; width: 17%; height: 23%; transform: scaleX(-1); }
  .chairFabric { fill: #5a2515; stroke: #3a1509; stroke-width: 4; }
  .chairFabricLight { fill: #7a3520; stroke: #3a1509; stroke-width: 4; }
  .chairLeg { stroke: #caa06a; stroke-width: 11; stroke-linecap: round; fill: none; }
  .chairLegBack { stroke: #a67e4c; stroke-width: 10; stroke-linecap: round; fill: none; }
  .chairLegCasing { stroke: #2c1006; stroke-width: 15; stroke-linecap: round; fill: none; }
  .chairShadow { fill: rgba(5,2,10,0.4); }
  .chairSeam { fill: none; stroke: #3a1509; stroke-width: 2.5; opacity: 0.7; }
  .chairRim { fill: none; stroke: #a4593a; stroke-width: 2.5; opacity: 0.8; }

  /* ── 13. vignette — two edge-to-edge linear gradients, sidesteps the radial-margin check
     entirely (a vignette's dark color is SUPPOSED to reach the box edge) ── */
  .vignette {
    background:
      linear-gradient(90deg, rgba(3,1,10,0.55) 0%, transparent 14%, transparent 86%, rgba(3,1,10,0.55) 100%),
      linear-gradient(180deg, rgba(3,1,10,0.5) 0%, transparent 16%, transparent 82%, rgba(3,1,10,0.42) 100%);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .meteorStreak, .flameLayer, .glowPulse, .corePulse, .poolPulse, .ember {
      animation: none !important;
    }
    .star { opacity: var(--hi, 1); }
    .meteorStreak { opacity: 0; }
    .ember { opacity: 0; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="layer baseWash"></div>

  <!-- ELEMENT: stars -->

<script>
  // Stars: hand-placed, mostly y3-26% (well clear of the y28-72% safe-area), a few sparse ones
  // dip to y30-33% but stay dim enough (--lo/--hi kept low) to clear the luminance floor there.
  const STARS = [
    [4,6,3,0.65,1],[9,14,4,0.55,0.95],[14,4,3,0.7,1],[19,19,3,0.6,0.95],
    [24,9,4,0.55,0.92],[29,16,3,0.65,1],[35,5,4,0.6,1],[41,22,3,0.55,0.9],
    [47,11,4,0.65,1],[53,7,3,0.55,0.95],[58,18,4,0.6,1],[64,4,3,0.65,0.95],
    [70,13,4,0.55,0.95],[76,20,3,0.65,1],[82,8,4,0.6,1],[87,15,3,0.55,0.92],
    [93,6,4,0.65,1],[97,17,3,0.55,0.95],[12,25,2,0.45,0.75],[62,26,2,0.45,0.75],
    [88,25,2,0.45,0.77],[3,20,3,0.5,0.82],[45,3,4,0.65,1],[68,24,2,0.45,0.75]
  ];
  const starsHost = document.getElementById('stars');
  STARS.forEach(([x,y,size,lo,hi],i) => {
    const el = document.createElement('div');
    el.className = 'star';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.setProperty('--lo', lo);
    el.style.setProperty('--hi', hi);
    el.style.animationDuration = (3.2 + (i % 7) * 0.5) + 's';
    el.style.animationDelay = (-(i * 0.83)) + 's';
    starsHost.appendChild(el);
  });

  // Treeline: overlapping rounded crown clumps (real forest-edge silhouette — bumpy/rounded, not
  // mountains) + a handful of taller narrow conifer spikes at irregular positions, so the shape
  // has genuine per-clump height/width variation instead of one repeated scalloped unit. cy/r
  // both vary per clump; a solid base rect underneath (in the markup) fills any gaps between
  // clump bottoms so the silhouette reads as one continuous tree line, not floating circles.
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CROWNS = [ // [cx, cy, r]
    [10,178,22],[46,172,30],[86,180,18],[118,168,34],[156,176,24],[196,170,38],
    [238,179,20],[272,166,42],[312,174,26],[352,181,17],[388,169,36],[428,177,23],
    [464,171,33],[500,180,19],[536,165,45],[578,175,27],[614,182,16],[650,168,39],
    [690,176,24],[726,170,35],[764,179,21],[800,167,41],[838,174,28],[876,181,18],
    [912,169,37],[950,177,25],[988,171,32],[1026,180,20],[1064,166,44],[1104,175,26],
    [1142,182,17],[1178,168,38],[1216,176,23],[1254,171,34],[1292,179,19],[1330,165,46],
    [1370,175,27],[1408,181,16],[1446,169,40],[1484,177,24],[1522,172,31],[1560,180,20],
    [1596,168,28]
  ];
  const SPIKES = [ // [cx, tipY, halfWidth]  baseline at y=178
    [130,44,11],[340,68,9],[506,30,13],[700,60,10],[930,40,12],[1180,64,9],[1440,36,12]
  ];
  const crownsHost = document.getElementById('treeCrowns');
  CROWNS.forEach(([cx,cy,r]) => {
    const c = document.createElementNS(SVG_NS,'circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    crownsHost.appendChild(c);
  });
  const spikesHost = document.getElementById('treeSpikes');
  SPIKES.forEach(([cx,tipY,hw]) => {
    const p = document.createElementNS(SVG_NS,'polygon');
    p.setAttribute('points', `${cx-hw},178 ${cx},${tipY} ${cx+hw},178`);
    spikesHost.appendChild(p);
  });

  // Embers: rise confined to y76-99% of the stage (never above y76%, a 4pp margin below the
  // safe-area's y72 floor), so no eased-timeline masking is needed at all.
  const EMBERS = [
    [47,86,4.8,0], [52,88,5.6,-1.2], [44,84,6.2,-2.4], [56,87,5.1,-3.6],
    [49,90,6.8,-0.6], [58,85,5.4,-4.1]
  ];
  const embersHost = document.getElementById('embers');
  EMBERS.forEach(([x,y,dur,delay],i) => {
    const el = document.createElement('div');
    el.className = 'ember';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.setProperty('--dx', ((i % 2 === 0 ? 1 : -1) * (2 + i)) + 'px');
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    embersHost.appendChild(el);
  });
</script>

</body>
</html>
